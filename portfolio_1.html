<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIDEO DESIGN — PORTFOLIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121212;
    --surface: #1a1a1a;
    --surface-2: #232323;
    --ink: #f2f0eb;
    --ink-muted: #8a8a86;
    --amber: #e8a33d;
    --teal: #3a7d78;
    --rule: #2e2e2e;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; background: var(--bg); color: var(--ink);
    font-family: var(--font-body);
    overflow-x: hidden;
  }
  ::selection{ background: var(--amber); color: #1a1200; }

  /* ---------- header ---------- */
  header{
    padding: 48px 40px 20px;
    display:flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 1px solid var(--rule);
  }
  .brand{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.02em;
  }
  .brand span{ color: var(--amber); }
  .role{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 6px;
  }
  .hint{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-muted);
    text-align: right;
    letter-spacing: 0.04em;
  }
  .hint b{ color: var(--teal); font-weight: 500; }

  /* ---------- timecode ruler (signature element) ---------- */
  .ruler-wrap{
    position: relative;
    padding: 18px 40px 0;
    user-select: none;
  }
  .ruler{
    position: relative;
    height: 34px;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
  }
  .tick{
    position: absolute;
    bottom: 0;
    width: 1px;
    height: 10px;
    background: var(--rule);
  }
  .tick-label{
    position: absolute;
    bottom: 14px;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .playhead{
    position: absolute;
    bottom: -1px;
    width: 2px;
    height: 14px;
    background: var(--amber);
    transform: translateX(-1px);
    pointer-events: none;
  }
  .playhead::after{
    content:'';
    position: absolute;
    top: -5px; left: 50%;
    width: 8px; height: 8px;
    background: var(--amber);
    border-radius: 50%;
    transform: translateX(-50%);
  }
  .timecode-out{
    position: absolute;
    top: 18px; right: 40px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--amber);
  }

  /* ---------- filmstrip (drag scroll) ---------- */
  .stage{
    padding: 28px 0 60px 40px;
    overflow-x: auto;
    overflow-y: hidden;
    cursor: grab;
    scrollbar-width: none;
  }
  .stage::-webkit-scrollbar{ display:none; }
  .stage.dragging{ cursor: grabbing; }
  .filmstrip{
    display: flex;
    gap: 20px;
    width: max-content;
  }
  .card{
    width: 320px;
    flex: 0 0 auto;
  }
  .frame{
    width: 320px;
    height: 200px;
    background: var(--surface);
    border: 1px solid var(--rule);
    position: relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .frame video{
    width:100%; height:100%; object-fit: cover; display:block;
  }
  .frame iframe{
    width:100%; height:100%; border:0; display:block;
  }
  .yt-thumb{
    position:absolute; inset:0;
    background-size: cover;
    background-position: center;
    cursor: pointer;
  }
  .yt-thumb::after{
    content:'';
    position:absolute; inset:0;
    background: rgba(0,0,0,0.25);
  }
  .yt-play{
    position:absolute; top:50%; left:50%;
    transform: translate(-50%,-50%);
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(18,18,18,0.7);
    border: 1px solid var(--amber);
    display:flex; align-items:center; justify-content:center;
    z-index: 1;
  }
  .yt-play::after{
    content:'';
    width:0; height:0;
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    border-left: 11px solid var(--amber);
    margin-left: 3px;
  }

  /* ---------- 영상 팝업 모달 ---------- */
  .modal-overlay{
    position: fixed; inset: 0;
    background: rgba(8,8,8,0.88);
    display:flex; align-items:center; justify-content:center;
    z-index: 100;
    padding: 40px;
  }
  .modal-box{
    width: min(900px, 100%);
    background: var(--surface);
    border: 1px solid var(--rule);
  }
  .modal-video{
    position: relative;
    width: 100%;
    padding-top: 56.25%;
  }
  .modal-video iframe{
    position:absolute; inset:0;
    width:100%; height:100%; border:0;
  }
  .modal-close{
    display:flex; align-items:center; justify-content: flex-end;
    padding: 10px 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-muted);
    cursor: pointer;
  }
  .modal-close:hover{ color: var(--amber); }
  .leader{
    width: 76px; height: 76px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-mono);
    font-size: 22px;
    color: var(--ink-muted);
  }
  .frame .badge{
    position:absolute; top:10px; left:10px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--teal);
    background: rgba(58,125,120,0.12);
    padding: 3px 7px;
    letter-spacing: 0.05em;
  }
  .frame .idx{
    position:absolute; bottom:10px; right:10px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-muted);
  }
  .slate{
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--rule);
  }
  .slate-title{
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 17px;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
  }
  .slate-row{
    display:flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-muted);
    letter-spacing: 0.03em;
    margin-bottom: 3px;
  }
  .slate-row b{ color: var(--ink); font-weight: 400; }

  /* end card */
  .end-card{
    width: 260px;
    flex: 0 0 auto;
    display:flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding-right: 40px;
  }
  .end-card p{
    font-family: var(--font-display);
    font-size: 22px;
    line-height: 1.35;
    margin: 0 0 16px;
  }
  .end-card a{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--amber);
    text-decoration: none;
    border-bottom: 1px solid var(--amber);
    padding-bottom: 2px;
  }

  @media (max-width: 640px){
    header{ padding: 32px 20px 16px; flex-direction: column; align-items: flex-start; gap:10px;}
    .hint{ text-align:left; }
    .ruler-wrap{ padding: 16px 20px 0; }
    .timecode-out{ right: 20px; }
    .stage{ padding-left: 20px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">YOUR NAME<span>.</span></div>
    <div class="role">Video Designer — Motion / Edit / Color</div>
  </div>
  <div class="hint">드래그해서 오른쪽으로 넘겨보세요<br><b>SCROLL / DRAG →</b></div>
</header>

<div class="ruler-wrap">
  <div class="ruler" id="ruler"></div>
  <div class="timecode-out" id="timecodeOut">00:00:00:00</div>
</div>

<div class="stage" id="stage">
  <div class="filmstrip" id="filmstrip"></div>
</div>

<script>
// ---------------------------------------------------------
// 프로젝트 데이터: youtube 항목에 유튜브 영상 링크(또는 영상 ID)만 넣으면 됩니다.
// 예: "https://www.youtube.com/watch?v=abc123XYZ"
//     "https://youtu.be/abc123XYZ"
//     "abc123XYZ" (ID만 넣어도 됨)
// 비워두면 필름 리더 번호 플레이스홀더가 표시됩니다.
// ---------------------------------------------------------
const projects = [
  { title: "프로젝트 제목 01", role: "Motion Graphics", tool: "AE / C4D", year: "2024", youtube: "https://www.youtube.com/watch?v=0vRGVkjNG3Q" },
  { title: "프로젝트 제목 02", role: "Edit / Color",     tool: "Premiere",  year: "2024", youtube: "" },
  { title: "프로젝트 제목 03", role: "Title Design",      tool: "AE",        year: "2023", youtube: "" },
  { title: "프로젝트 제목 04", role: "Music Video Edit",  tool: "Premiere",  year: "2023", youtube: "" },
  { title: "프로젝트 제목 05", role: "Brand Film",        tool: "AE / DaVinci", year: "2023", youtube: "" },
  { title: "프로젝트 제목 06", role: "Motion Graphics",   tool: "AE",        year: "2022", youtube: "" },
  { title: "프로젝트 제목 07", role: "Commercial Edit",   tool: "Premiere",  year: "2022", youtube: "" },
  { title: "프로젝트 제목 08", role: "VFX Comp",          tool: "AE / Nuke", year: "2022", youtube: "" },
  { title: "프로젝트 제목 09", role: "Title Design",      tool: "AE",        year: "2021", youtube: "" },
  { title: "프로젝트 제목 10", role: "Color Grading",     tool: "DaVinci",   year: "2021", youtube: "" },
  { title: "프로젝트 제목 11", role: "Motion Graphics",   tool: "AE / C4D",  year: "2021", youtube: "" },
];

function extractYouTubeId(input) {
  if (!input) return null;
  const trimmed = input.trim();
  if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
  const patterns = [
    /youtu\.be\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
  ];
  for (const re of patterns) {
    const m = trimmed.match(re);
    if (m) return m[1];
  }
  return null;
}

const filmstrip = document.getElementById('filmstrip');

projects.forEach((p, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  const num = String(i + 1).padStart(2, '0');
  const ytId = extractYouTubeId(p.youtube);

  let mediaHTML;
  if (ytId) {
    mediaHTML = `
      <div class="yt-thumb" style="background-image:url('https://img.youtube.com/vi/${ytId}/hqdefault.jpg')" data-yt="${ytId}">
        <div class="yt-play"></div>
      </div>`;
  } else {
    mediaHTML = `<div class="leader">${num}</div>`;
  }

  card.innerHTML = `
    <div class="frame">
      <span class="badge">${p.role.split(' ')[0].toUpperCase()}</span>
      ${mediaHTML}
      <span class="idx">${num} / ${String(projects.length).padStart(2,'0')}</span>
    </div>
    <div class="slate">
      <p class="slate-title">${p.title}</p>
      <div class="slate-row"><span>ROLE</span><b>${p.role}</b></div>
      <div class="slate-row"><span>TOOL</span><b>${p.tool}</b></div>
    </div>
  `;
  filmstrip.appendChild(card);
});

// 썸네일 클릭 시 팝업으로 유튜브 영상 재생
filmstrip.addEventListener('click', (e) => {
  const thumb = e.target.closest('.yt-thumb');
  if (!thumb) return;
  openVideoModal(thumb.dataset.yt);
});

function openVideoModal(ytId) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-close">CLOSE ✕</div>
      <div class="modal-video">
        <iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  function close() { overlay.remove(); document.removeEventListener('keydown', onKey); }
  function onKey(e) { if (e.key === 'Escape') close(); }

  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) close();
  });
  overlay.querySelector('.modal-close').addEventListener('click', close);
  document.addEventListener('keydown', onKey);
}

const endCard = document.createElement('div');
endCard.className = 'end-card';
endCard.innerHTML = `
  <p>더 많은 작업물이<br>궁금하신가요?</p>
  <a href="mailto:you@example.com">CONTACT →</a>
`;
filmstrip.appendChild(endCard);

// ---------------------------------------------------------
// 드래그 스크롤 + 타임코드 스크러버
// ---------------------------------------------------------
const stage = document.getElementById('stage');
const ruler = document.getElementById('ruler');
const timecodeOut = document.getElementById('timecodeOut');

let isDown = false, startX = 0, startScroll = 0;

stage.addEventListener('mousedown', (e) => {
  isDown = true;
  stage.classList.add('dragging');
  startX = e.pageX;
  startScroll = stage.scrollLeft;
});
window.addEventListener('mouseup', () => {
  isDown = false;
  stage.classList.remove('dragging');
});
window.addEventListener('mousemove', (e) => {
  if (!isDown) return;
  e.preventDefault();
  const dx = e.pageX - startX;
  stage.scrollLeft = startScroll - dx;
});

// 세로 휠도 가로 스크롤로 변환
stage.addEventListener('wheel', (e) => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
    e.preventDefault();
    stage.scrollLeft += e.deltaY;
  }
}, { passive: false });

function buildRuler() {
  ruler.innerHTML = '';
  const totalTicks = 40;
  for (let i = 0; i <= totalTicks; i++) {
    const tick = document.createElement('div');
    tick.className = 'tick';
    tick.style.left = (i / totalTicks * 100) + '%';
    ruler.appendChild(tick);
    if (i % 5 === 0) {
      const label = document.createElement('div');
      label.className = 'tick-label';
      label.style.left = (i / totalTicks * 100) + '%';
      const frames = i * 3;
      label.textContent = '00:00:' + String(Math.floor(frames/24)).padStart(2,'0') + ':' + String(frames%24).padStart(2,'0');
      ruler.appendChild(label);
    }
  }
  const playhead = document.createElement('div');
  playhead.className = 'playhead';
  playhead.id = 'playhead';
  ruler.appendChild(playhead);
}
buildRuler();

function updatePlayhead() {
  const maxScroll = stage.scrollWidth - stage.clientWidth;
  const pct = maxScroll > 0 ? stage.scrollLeft / maxScroll : 0;
  const playhead = document.getElementById('playhead');
  playhead.style.left = (pct * 100) + '%';

  const totalFrames = Math.round(pct * 999);
  const ff = totalFrames % 24;
  const ss = Math.floor(totalFrames / 24) % 60;
  const mm = Math.floor(totalFrames / 24 / 60) % 60;
  timecodeOut.textContent =
    '00:' + String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0') + ':' + String(ff).padStart(2,'0');
}
stage.addEventListener('scroll', updatePlayhead);
updatePlayhead();

// 룰러를 클릭하면 해당 위치로 스크롤 이동 (스크러빙)
ruler.addEventListener('click', (e) => {
  const rect = ruler.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const maxScroll = stage.scrollWidth - stage.clientWidth;
  stage.scrollTo({ left: pct * maxScroll, behavior: 'smooth' });
});
</script>

</body>
</html>
