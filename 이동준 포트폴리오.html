<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIDEO DESIGN — PORTFOLIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121212;
    --surface: #1a1a1a;
    --ink: #f2f0eb;
    --ink-muted: #8a8a86;
    --amber: #e8a33d;
    --teal: #3a7d78;
    --rule: #2e2e2e;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; background: var(--bg); color: var(--ink);
    font-family: var(--font-body);
    overflow-x: hidden;
    height: 100%;
  }
  ::selection{ background: var(--amber); color: #1a1200; }

  /* ---------- header ---------- */
  header{
    padding: 40px 40px 16px;
    display:flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 1px solid var(--rule);
  }
  .brand{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.02em;
  }
  .brand span{ color: var(--amber); }
  .role-label{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 6px;
  }
  .hint{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-muted);
    text-align: right;
    letter-spacing: 0.04em;
  }
  .hint b{ color: var(--teal); font-weight: 500; }

  /* ---------- 인덱스 룰러 ---------- */
  .ruler-wrap{
    padding: 16px 40px 0;
  }
  .ruler{
    position: relative;
    height: 30px;
    border-bottom: 1px solid var(--rule);
  }
  .ruler-track{
    position: relative;
    height: 100%;
  }
  .tick{
    position: absolute;
    bottom: 0;
    transform: translateX(-50%);
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--rule);
    cursor: pointer;
  }
  .tick.active{ background: var(--amber); }
  .tick-label{
    position: absolute;
    bottom: 14px;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-muted);
  }

  /* ---------- 캐러셀 무대 ---------- */
  .stage{
    height: calc(100vh - 150px);
    min-height: 480px;
    display: flex;
    align-items: center;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    cursor: grab;
    scrollbar-width: none;
  }
  .stage::-webkit-scrollbar{ display:none; }
  .stage.dragging{ cursor: grabbing; scroll-snap-type: none; }

  .spacer{ flex: 0 0 auto; }

  .slide{
    flex: 0 0 auto;
    scroll-snap-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0.3;
    transform: scale(0.9);
    transition: opacity 0.3s ease, transform 0.3s ease;
    padding: 0 20px;
  }
  .slide.active{ opacity: 1; transform: scale(1); }

  .slide-title{
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 24px;
    letter-spacing: -0.01em;
    margin: 0 0 18px;
    text-align: center;
  }
  .frame{
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--surface);
    border: 1px solid var(--rule);
    position: relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .frame iframe{
    width:100%; height:100%; border:0; display:block;
  }
  .leader{
    width: 84px; height: 84px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-mono);
    font-size: 24px;
    color: var(--ink-muted);
  }
  .yt-thumb{
    position:absolute; inset:0;
    background-size: cover;
    background-position: center;
    cursor: pointer;
  }
  .yt-thumb::after{
    content:'';
    position:absolute; inset:0;
    background: rgba(0,0,0,0.25);
  }
  .yt-play{
    position:absolute; top:50%; left:50%;
    transform: translate(-50%,-50%);
    width: 58px; height: 58px;
    border-radius: 50%;
    background: rgba(18,18,18,0.7);
    border: 1px solid var(--amber);
    display:flex; align-items:center; justify-content:center;
    z-index: 1;
  }
  .yt-play::after{
    content:'';
    width:0; height:0;
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-left: 13px solid var(--amber);
    margin-left: 3px;
  }
  .frame .badge{
    position:absolute; top:12px; left:12px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--teal);
    background: rgba(58,125,120,0.12);
    padding: 3px 7px;
    letter-spacing: 0.05em;
    z-index: 1;
  }

  .slide-role{
    margin-top: 16px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .end-slide .slide-title{ margin-bottom: 12px; }
  .end-slide-body{
    display:flex; flex-direction: column; align-items:center; justify-content:center;
    height: 100%;
  }
  .end-slide-body a{
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--amber);
    text-decoration: none;
    border-bottom: 1px solid var(--amber);
    padding-bottom: 2px;
    margin-top: 8px;
  }

  @media (max-width: 640px){
    header{ padding: 28px 20px 14px; flex-direction: column; align-items: flex-start; gap:10px;}
    .hint{ text-align:left; }
    .ruler-wrap{ padding: 14px 20px 0; }
    .stage{ height: calc(100vh - 210px); }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">이동준<span>.</span></div>
    <div class="role-label">Video Designer — Motion / Edit </div>
  </div>
  <div class="hint">드래그/휠로 넘겨보세요<br><b>DRAG/WHEEL ←→</b></div>
</header>

<div class="ruler-wrap">
  <div class="ruler"><div class="ruler-track" id="rulerTrack"></div></div>
</div>

<div class="stage" id="stage">
  <div class="spacer" id="spacerStart"></div>
  <div class="filmstrip" id="filmstrip" style="display:flex;"></div>
  <div class="spacer" id="spacerEnd"></div>
</div>

<script>
// ---------------------------------------------------------
// 프로젝트 데이터: youtube 항목에 유튜브 영상 링크(또는 영상 ID)만 넣으면 됩니다.
// 예: "https://www.youtube.com/watch?v=abc123XYZ"
//     "https://youtu.be/abc123XYZ"
//     "abc123XYZ" (ID만 넣어도 됨)
// ---------------------------------------------------------
const projects = [
  { title: "부경대학교 교수학습지원센터 홍보영상", role: "Motion Graphics", youtube: "https://www.youtube.com/watch?v=s4TlD7xJ_Ps" },
  { title: "홍범도 계봉우 유해봉관과 묘역조성 전시영상", role: "Motion Graphics",     youtube: "https://www.youtube.com/watch?v=jWrwPTW-dVo" },
  { title: "CALAB 에리아 환기필터 광고영상", role: "Motion Graphics",      youtube: "https://www.youtube.com/watch?v=BV_Qe3uTwU8" },
  { title: "프로젝트 제목 04", role: "Motion Graphics",  youtube: "https://www.youtube.com/watch?v=MN3N2PfdsLw" },
  { title: "부산광역시 자원봉사센터 기초교육 영상", role: "Motion Graphics",        youtube: "https://www.youtube.com/watch?v=0vRGVkjNG3Q" },
  { title: "제이디스 수학문화관 수학의 날 행사 스케치 영상", role: "Motion Graphics/Edit",   youtube: "https://www.youtube.com/watch?v=ExQcCCuka9Y&t=3s" },
  { title: "전주대학교 지역고교연계콘텐츠제작", role: "Motion Graphics/Edit",   youtube: "https://www.youtube.com/watch?v=w0djDX4lByI" },
  { title: "김해시 찬새미의 정수공정", role: "Motion Graphics",          youtube: "https://www.youtube.com/watch?v=m-9A_ZrrqNc" },
  { title: "VETKIT 제품 홍보영상", role: "Motion Graphics/Edit",      youtube: "https://www.youtube.com/watch?v=QyoXMtk2gOQ" },
  { title: "부산문제해결플랫폼 의제 소개 영상", role: "Motion Graphics/Edit",     youtube: "https://www.youtube.com/watch?v=38F6uznDDp8" },
  { title: "롯데쇼핑 사회공헌 리조이스 특강 자기돌봄, 마음 방역 생활", role: "Motion Graphics/Edit",   youtube: "https://www.youtube.com/watch?v=hVYZ-kQQrj4" },
];

function extractYouTubeId(input) {
  if (!input) return null;
  const trimmed = input.trim();
  if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
  const patterns = [
    /youtu\.be\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
  ];
  for (const re of patterns) {
    const m = trimmed.match(re);
    if (m) return m[1];
  }
  return null;
}

const filmstrip = document.getElementById('filmstrip');
const SLIDE_WIDTH = 1080; // 카드 하나의 너비(px). 필요하면 이 숫자만 바꾸면 전체 크기 조절됨.

projects.forEach((p, i) => {
  const slide = document.createElement('div');
  slide.className = 'slide';
  slide.style.width = SLIDE_WIDTH + 'px';
  const num = String(i + 1).padStart(2, '0');
  const ytId = extractYouTubeId(p.youtube);

  let mediaHTML;
  if (ytId) {
    mediaHTML = `
      <div class="yt-thumb" data-yt="${ytId}">
        <div class="yt-play"></div>
      </div>`;
  } else {
    mediaHTML = `<div class="leader">${num}</div>`;
  }

  slide.innerHTML = `
    <div class="slide-title">${p.title}</div>
    <div class="frame">
      <span class="badge">${p.role.split(' ')[0].toUpperCase()}</span>
      ${mediaHTML}
    </div>
    <div class="slide-role">${p.role}</div>
  `;
  filmstrip.appendChild(slide);
});

const endSlide = document.createElement('div');
endSlide.className = 'slide end-slide';
endSlide.style.width = SLIDE_WIDTH + 'px';
endSlide.innerHTML = `
  <div class="frame end-slide-body">
    <div class="slide-title">더 많은 작업물이<br>궁금하신가요?</div>
    <a href="https://www.saramin.co.kr/zf_user/member/resume/view/edit_icon_fl/y/res_idx/14455934/mandb_view/n">CONTACT →</a>
  </div>
`;
filmstrip.appendChild(endSlide);

const slides = Array.from(document.querySelectorAll('.slide'));

// ---------------------------------------------------------
// 썸네일 화질: maxresdefault(고화질)을 먼저 시도하고, 없는 영상이면
// hqdefault(기본 화질)로 자동 대체
// ---------------------------------------------------------
document.querySelectorAll('.yt-thumb').forEach((thumb) => {
  const ytId = thumb.dataset.yt;
  const hi = new Image();
  hi.onload = () => {
    // 고화질 썸네일이 없는 영상은 120x90 회색 기본 이미지가 대신 옴 -> 그럼 hqdefault로 대체
    if (hi.naturalWidth <= 120) {
      thumb.style.backgroundImage = `url('https://img.youtube.com/vi/${ytId}/hqdefault.jpg')`;
    } else {
      thumb.style.backgroundImage = `url('https://img.youtube.com/vi/${ytId}/maxresdefault.jpg')`;
    }
  };
  hi.onerror = () => {
    thumb.style.backgroundImage = `url('https://img.youtube.com/vi/${ytId}/hqdefault.jpg')`;
  };
  hi.src = `https://img.youtube.com/vi/${ytId}/maxresdefault.jpg`;
});

// ---------------------------------------------------------
// 스페이서: 첫/마지막 카드도 화면 중앙에 오도록 좌우 여백을 계산
// ---------------------------------------------------------
const stage = document.getElementById('stage');
const spacerStart = document.getElementById('spacerStart');
const spacerEnd = document.getElementById('spacerEnd');

function updateSpacers() {
  const gap = Math.max(0, (stage.clientWidth - SLIDE_WIDTH) / 2);
  spacerStart.style.width = gap + 'px';
  spacerEnd.style.width = gap + 'px';
}
updateSpacers();
window.addEventListener('resize', updateSpacers);

// ---------------------------------------------------------
// 드래그 스크롤
// ---------------------------------------------------------
let isDown = false, startX = 0, startScroll = 0;
let wheelLocked = false;
let currentIndex = 0;

stage.addEventListener('mousedown', (e) => {
  isDown = true;
  stage.classList.add('dragging');
  startX = e.pageX;
  startScroll = stage.scrollLeft;
});
window.addEventListener('mouseup', () => {
  isDown = false;
  stage.classList.remove('dragging');
});
window.addEventListener('mousemove', (e) => {
  if (!isDown) return;
  e.preventDefault();
  const dx = e.pageX - startX;
  stage.scrollLeft = startScroll - dx;
});

stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (wheelLocked) return;
  const delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (Math.abs(delta) < 8) return;
  wheelLocked = true;
  const dir = delta > 0 ? 1 : -1;
  const next = Math.min(slides.length - 1, Math.max(0, currentIndex + dir));
  scrollToSlide(next);
  setTimeout(() => { wheelLocked = false; }, 480);
}, { passive: false });

// ---------------------------------------------------------
// 인덱스 룰러 (점 하나 = 슬라이드 하나)
// ---------------------------------------------------------
const rulerTrack = document.getElementById('rulerTrack');
const totalCount = slides.length;

slides.forEach((s, i) => {
  const tick = document.createElement('div');
  tick.className = 'tick';
  tick.style.left = (totalCount === 1 ? 50 : (i / (totalCount - 1)) * 100) + '%';
  tick.dataset.index = i;
  tick.addEventListener('click', () => scrollToSlide(i));
  rulerTrack.appendChild(tick);
});

function scrollToSlide(i) {
  const target = slides[i];
  const targetCenter = target.offsetLeft + target.offsetWidth / 2;
  stage.scrollTo({ left: targetCenter - stage.clientWidth / 2, behavior: 'smooth' });
}

// ---------------------------------------------------------
// 현재 중앙에 위치한 슬라이드를 active로 표시 + 룰러 동기화
// ---------------------------------------------------------
let ticking = false;
function updateActiveSlide() {
  const stageCenter = stage.scrollLeft + stage.clientWidth / 2;
  let closestIdx = 0;
  let closestDist = Infinity;
  slides.forEach((s, i) => {
    const slideCenter = s.offsetLeft + s.offsetWidth / 2;
    const dist = Math.abs(slideCenter - stageCenter);
    if (dist < closestDist) { closestDist = dist; closestIdx = i; }
    s.classList.toggle('active', dist < s.offsetWidth / 2);
  });
  document.querySelectorAll('.tick').forEach((t, i) => {
    t.classList.toggle('active', i === closestIdx);
  });
  currentIndex = closestIdx;
  ticking = false;
}
stage.addEventListener('scroll', () => {
  if (!ticking) {
    requestAnimationFrame(updateActiveSlide);
    ticking = true;
  }
});
updateActiveSlide();

// ---------------------------------------------------------
// 썸네일 클릭 시 그 카드 안에서 바로 재생 (팝업 없이)
// ---------------------------------------------------------
filmstrip.addEventListener('click', (e) => {
  const thumb = e.target.closest('.yt-thumb');
  if (!thumb) return;
  const iframe = document.createElement('iframe');
  iframe.src = `https://www.youtube.com/embed/${thumb.dataset.yt}?autoplay=1`;
  iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
  iframe.allowFullscreen = true;
  thumb.replaceWith(iframe);
});
</script>

</body>
</html>
